<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #23081a;
        --ink: #ffffff;
        --accent: #c2265f;
        --font-display: sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">Estúdio de Vídeo</h1>
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="1" style="position:absolute;bottom:380px;left:50%;width:640px;height:10px;margin-left:-320px;background:var(--accent);transform-origin:left center"></div>
      <p id="sub" class="clip" data-start="0" data-duration="5" data-track-index="2" style="position:absolute;bottom:300px;width:100%;text-align:center;color:var(--ink);font-family:var(--font-display);font-size:40px;opacity:.85">teste de render · 5 segundos</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title",{opacity:0,y:40,filter:"blur(8px)"},{opacity:1,y:0,filter:"blur(0px)",duration:0.8,ease:"power4.out"},0.2);
      tl.fromTo("#bar",{scaleX:0},{scaleX:1,duration:1.2,ease:"power2.inOut"},0.8);
      tl.fromTo("#sub",{opacity:0},{opacity:0.85,duration:0.6},1.6);
      tl.to(["#title","#sub","#bar"],{opacity:0,duration:0.5},4.4);
      // Example: tl.fromTo("#title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
